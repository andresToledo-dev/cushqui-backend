name: Deploy production

# Runs on every merge to main: checks → migrations on the PROD database → Vercel deploy.
# Migrations always run before the new code goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Vercel rejects old CLIs (deploy needs >= 47.2.2): bump this when it complains
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  deploy:
    # Only ever deploy main (a manual "Run workflow" defaults to the default branch, dev)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets live in the "production" GitHub Environment (Settings → Environments)
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the production database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
