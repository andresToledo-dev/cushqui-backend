version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cushqui-postgres
    environment:
      POSTGRES_USER: cushqui
      POSTGRES_PASSWORD: cushqui
      POSTGRES_DB: cushqui
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cushqui -d cushqui"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: